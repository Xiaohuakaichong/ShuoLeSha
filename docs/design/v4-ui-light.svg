<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><rect width="1440" height="1080" fill="#FAFAFA"/><style>text{font-family:"Microsoft YaHei",Arial,sans-serif} .title{font-size:24px;font-weight:600}.body{font-size:15px}.small{font-size:12px}</style><text x="48" y="54" fill="#18181B" font-size="28" font-weight="600">说了啥 4.0</text><text x="48" y="83" fill="#61616B" font-size="14" font-weight="400">极简专业 · 关键页面设计预览 · 内容均为示例</text><rect x="48" y="112" width="378" height="752" rx="30" fill="#FFFFFF" stroke="#E4E4E7"/><text x="72" y="160" fill="#18181B" font-size="23" font-weight="600">记忆</text><rect x="466" y="112" width="378" height="752" rx="30" fill="#FFFFFF" stroke="#E4E4E7"/><text x="490" y="160" fill="#18181B" font-size="23" font-weight="600">正在记录</text><rect x="884" y="112" width="378" height="752" rx="30" fill="#FFFFFF" stroke="#E4E4E7"/><text x="908" y="160" fill="#18181B" font-size="23" font-weight="600">原话与来源</text><rect x="68" y="186" width="338" height="48" rx="12" fill="#FAFAFA" stroke="#E4E4E7"/><text x="84" y="216" fill="#61616B" font-size="14" font-weight="400">搜索原话，或问记忆</text><rect x="68" y="251" width="62" height="32" rx="16" fill="#2563EB"/><text x="83" y="272" fill="#FFFFFF" font-size="13" font-weight="400">全部</text><rect x="141" y="251" width="62" height="32" rx="16" fill="#FAFAFA"/><text x="156" y="272" fill="#18181B" font-size="13" font-weight="400">随身</text><rect x="214" y="251" width="62" height="32" rx="16" fill="#FAFAFA"/><text x="229" y="272" fill="#18181B" font-size="13" font-weight="400">会议</text><text x="336" y="272" fill="#61616B" font-size="13" font-weight="400">筛选</text><text x="70" y="318" fill="#61616B" font-size="13" font-weight="400">今天</text><rect x="68" y="336" width="338" height="140" rx="16" fill="#FFFFFF" stroke="#E4E4E7"/><text x="84" y="368" fill="#18181B" font-size="16" font-weight="600">产品讨论与周五发布</text><text x="84" y="401" fill="#61616B" font-size="14" font-weight="400">确认先完善录音，再推进记忆检索。</text><text x="84" y="444" fill="#61616B" font-size="12" font-weight="400">14:30 · 会议 · 42 分钟</text><rect x="68" y="494" width="338" height="140" rx="16" fill="#FFFFFF" stroke="#E4E4E7"/><text x="84" y="526" fill="#18181B" font-size="16" font-weight="600">散步时想到的记录方式</text><text x="84" y="559" fill="#61616B" font-size="14" font-weight="400">希望能快速找回自己答应过的事。</text><text x="84" y="602" fill="#61616B" font-size="12" font-weight="400">09:18 · 随身 · 1 项待确认</text><rect x="293" y="728" width="110" height="52" rx="26" fill="#2563EB"/><text x="323" y="760" fill="#FFFFFF" font-size="14" font-weight="600">● 录音</text><text x="92" y="830" fill="#2563EB" font-size="14" font-weight="400">记忆</text><text x="210" y="830" fill="#61616B" font-size="14" font-weight="400">今日</text><text x="328" y="830" fill="#61616B" font-size="14" font-weight="400">待办</text><text x="768" y="160" fill="#2563EB" font-size="14" font-weight="400">收起</text><g transform="translate(614 226) scale(0.82)"><path d="M50 12 C28 12 12 28 12 48 C12 64 22 76 36 81 L29 94 L52 85 C73 84 88 68 88 48 C88 27 72 12 50 12 Z" fill="#18181B"/><rect x="34" y="37" width="9" height="21" rx="4.5" fill="#FFFFFF"/><rect x="58" y="37" width="9" height="21" rx="4.5" fill="#FFFFFF"/></g><text x="520" y="375" fill="#18181B" font-size="48" font-weight="600">00:18:42</text><text x="616" y="416" fill="#61616B" font-size="14" font-weight="400">随身录音</text><rect x="527" y="454.0" width="5" height="12" rx="3" fill="#2563EB"/><rect x="541" y="450.0" width="5" height="20" rx="3" fill="#2563EB"/><rect x="555" y="445.0" width="5" height="30" rx="3" fill="#2563EB"/><rect x="569" y="439.0" width="5" height="42" rx="3" fill="#2563EB"/><rect x="583" y="443.0" width="5" height="34" rx="3" fill="#2563EB"/><rect x="597" y="449.0" width="5" height="22" rx="3" fill="#2563EB"/><rect x="611" y="453.0" width="5" height="14" rx="3" fill="#2563EB"/><rect x="625" y="454.0" width="5" height="12" rx="3" fill="#2563EB"/><rect x="639" y="450.0" width="5" height="20" rx="3" fill="#2563EB"/><rect x="653" y="445.0" width="5" height="30" rx="3" fill="#2563EB"/><rect x="667" y="439.0" width="5" height="42" rx="3" fill="#2563EB"/><rect x="681" y="443.0" width="5" height="34" rx="3" fill="#2563EB"/><rect x="695" y="449.0" width="5" height="22" rx="3" fill="#2563EB"/><rect x="709" y="453.0" width="5" height="14" rx="3" fill="#2563EB"/><rect x="723" y="454.0" width="5" height="12" rx="3" fill="#2563EB"/><rect x="737" y="450.0" width="5" height="20" rx="3" fill="#2563EB"/><rect x="751" y="445.0" width="5" height="30" rx="3" fill="#2563EB"/><rect x="765" y="439.0" width="5" height="42" rx="3" fill="#2563EB"/><rect x="779" y="443.0" width="5" height="34" rx="3" fill="#2563EB"/><text x="532" y="517" fill="#61616B" font-size="14" font-weight="400">已保存 3 段 · 已转写 2 段</text><text x="503" y="620" fill="#61616B" font-size="14" font-weight="400">录音已保存在手机中</text><text x="503" y="646" fill="#61616B" font-size="14" font-weight="400">停止后统一整理成话题</text><rect x="490" y="710" width="104" height="52" rx="16" fill="#FAFAFA" stroke="#E4E4E7"/><text x="527" y="742" fill="#18181B" font-size="15" font-weight="400">暂停</text><rect x="606" y="710" width="214" height="52" rx="16" fill="#2563EB"/><text x="651" y="742" fill="#FFFFFF" font-size="15" font-weight="600">停止并整理</text><text x="525" y="804" fill="#61616B" font-size="13" font-weight="400">收起后仍可浏览，录音会继续</text><text x="908" y="201" fill="#18181B" font-size="18" font-weight="600">产品讨论与周五发布</text><text x="908" y="232" fill="#61616B" font-size="12" font-weight="400">今天 14:30 · 会议</text><text x="908" y="282" fill="#61616B" font-size="15" font-weight="400">概览</text><text x="985" y="282" fill="#2563EB" font-size="15" font-weight="600">原文</text><rect x="904" y="310" width="338" height="156" rx="12" fill="#EFF6FF"/><text x="921" y="343" fill="#2563EB" font-size="12" font-weight="400">引用 1 · 转写原稿</text><text x="921" y="378" fill="#18181B" font-size="16" font-weight="400">我们把周五的版本先定下来，</text><text x="921" y="407" fill="#18181B" font-size="16" font-weight="400">这次优先做好录音和查找。</text><text x="921" y="442" fill="#2563EB" font-size="13" font-weight="400">回听此分片 →</text><text x="908" y="515" fill="#61616B" font-size="14" font-weight="400">后续讨论</text><text x="908" y="552" fill="#18181B" font-size="15" font-weight="400">搜索结果需要能回到对应的原话。</text><text x="908" y="584" fill="#18181B" font-size="15" font-weight="400">待办先确认，再进入统一列表。</text><rect x="904" y="719" width="338" height="62" rx="16" fill="#FAFAFA" stroke="#E4E4E7"/><text x="922" y="755" fill="#18181B" font-size="15" font-weight="400">▶   00:00 / 05:00</text><text x="908" y="817" fill="#61616B" font-size="12" font-weight="400">来源位置以实际音频时间为准</text><text x="48" y="930" fill="#18181B" font-size="18" font-weight="600">新“侧耳” · 八种业务状态</text><g transform="translate(52 950) scale(0.62)"><path d="M50 12 C28 12 12 28 12 48 C12 64 22 76 36 81 L29 94 L52 85 C73 84 88 68 88 48 C88 27 72 12 50 12 Z" fill="#18181B"/><rect x="34" y="37" width="9" height="21" rx="4.5" fill="#FFFFFF"/><rect x="58" y="37" width="9" height="21" rx="4.5" fill="#FFFFFF"/></g><text x="122" y="989" fill="#61616B" font-size="14" font-weight="400">待机</text><g transform="translate(216 950) scale(0.62)"><path d="M50 12 C28 12 12 28 12 48 C12 64 22 76 36 81 L29 94 L52 85 C73 84 88 68 88 48 C88 27 72 12 50 12 Z" fill="#18181B"/><rect x="34" y="37" width="9" height="21" rx="4.5" fill="#FFFFFF"/><rect x="58" y="37" width="9" height="21" rx="4.5" fill="#FFFFFF"/></g><text x="286" y="989" fill="#61616B" font-size="14" font-weight="400">录音</text><g transform="translate(380 950) scale(0.62)"><path d="M50 12 C28 12 12 28 12 48 C12 64 22 76 36 81 L29 94 L52 85 C73 84 88 68 88 48 C88 27 72 12 50 12 Z" fill="#18181B"/><rect x="34" y="37" width="9" height="5" rx="4.5" fill="#FFFFFF"/><rect x="58" y="37" width="9" height="5" rx="4.5" fill="#FFFFFF"/></g><text x="450" y="989" fill="#61616B" font-size="14" font-weight="400">暂停</text><g transform="translate(544 950) scale(0.62)"><path d="M50 12 C28 12 1